        //UNOS PODATAKA

let budzetveciiljednak;

    budzetveciiljednak = true;
} else {
    budzetveciiljednak = false; 
}
let budzettocnojednaktip;
if(budzet === ukupnaCijena){
    budzettocnojednaktip = true;
} else {
    budzettocnojednaktip = false; 
}
let text;
if(confirm("Želite li nastaviti s planiranjem dragi korisniče;!?")===true){
    text = "DA";
} else {
    text = "NE";
}
//Ispisic
if (text === "DA"){alert("ime: " + ime +  "Ukupna cijena: " + ukupnaCijena +  "Preostali budžet: " + preostaliBudzet +  "Budžet veći ili jednak ukupnoj cijeni: " + budzetveciiljednak + "\n" + "Budžet točno jednak ukupnoj cijeni: " + budzettocnojednaktip + "odg iz confirma:" +text);}
    </script>
